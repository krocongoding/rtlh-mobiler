  services:
    postgres:
      image: postgis/postgis:17-3.5
      ports:
        - "127.0.0.1:5432:5432"
      environment:
        POSTGRES_DB: cirebon_rtlh
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      volumes:
        - pgdata:/var/lib/postgresql/data

  volumes:
    pgdata: